<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-dudi { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 30px; fill: #0F172A; letter-spacing: -0.5px; }
      .brand-software { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 30px; fill: #EF4444; letter-spacing: -0.5px; }
      .brand-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10.5px; fill: #8E9DAE; letter-spacing: 3.2px; text-transform: uppercase; }
    </style>
  </defs>
  <text x="2" y="32">
    <tspan class="brand-dudi">DUDI </tspan>
    <tspan class="brand-software">SOFTWARE</tspan>
  </text>
  <text x="2" y="52" class="brand-sub">TECHNOLOGY SOLUTIONS HUB</text>
</svg>
